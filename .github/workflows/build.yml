name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Fills in any Flutter platform files that are not in the repo yet (never
      # overwrites existing ones) and commits them back, so the repo holds the
      # complete Android project after the first run.
      - name: Generate missing platform files
        run: |
          flutter create --org com.dreamsvibe --project-name post_mortem --platforms android .
          rm -f test/widget_test.dart
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Add generated Android platform files [skip ci]"
            git push
          fi

      # Same signing key on every build, so each new APK installs over the last one.
      - name: Install signing key
        run: |
          mkdir -p ~/.android
          cp android/debug.keystore ~/.android/debug.keystore

      - run: flutter pub get

      # Analyzer errors become annotations on the run, so they can be read
      # without downloading the full log.
      - name: Analyze
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.txt 2>&1
          status=$?
          cat analyze.txt
          grep -E '^\s*error •' analyze.txt | head -40 | while IFS= read -r line; do
            msg=$(echo "$line" | awk -F' • ' '{print $2}')
            loc=$(echo "$line" | awk -F' • ' '{print $3}')
            file=${loc%%:*}; rest=${loc#*:}; ln=${rest%%:*}
            echo "::error file=$file,line=$ln::$msg"
          done
          exit $status

      - name: Build APK
        run: |
          set +e
          flutter build apk --release --target-platform android-arm64 > build.txt 2>&1
          status=$?
          cat build.txt
          if [ $status -ne 0 ]; then
            grep -E 'Error:|error:|FAILURE|What went wrong|Exception' build.txt | head -30 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit $status

      - name: Publish as the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk post-mortem.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest post-mortem.apk \
            --target "$GITHUB_SHA" \
            --title "Post Mortem — latest build" \
            --notes "Built from ${GITHUB_SHA::7} on $(date -u +'%Y-%m-%d %H:%M UTC')." \
            --prerelease
